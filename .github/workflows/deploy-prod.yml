name: ReLink Production CI/CD

on:
  push:
    branches: [ "main", "dev" ] # main, dev 브랜치 직접 푸시 및 타 브랜치 PR 머지(Merge) 완료 시 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 소스 코드 가져오기

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # 자바 실행 환경 설정

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar # 빌드해서 실행 파일(Jar) 생성

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # 도커 허브 로그인

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/relink-backend:latest # 도커 이미지 만들어서 업로드

  deploy:
    needs: build-and-push # 빌드 작업이 성공해야 배포 시작
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VM1
        uses: appleboy/ssh-action@master # 서버에 원격 접속
        with:
          host: ${{ secrets.PROD_VM1_HOST }}
          username: ${{ secrets.PROD_VM1_USER }}
          key: ${{ secrets.PROD_VM1_SSH_KEY }}
          script: |
            cd ~/Searchweb/deploy
            # 서버에서 최신 이미지로 교체 및 재시작
            sudo docker compose -f docker-compose-prod-web.yml pull backend
            sudo docker compose -f docker-compose-prod-web.yml up -d backend
            # 오래된 이미지 파일 정리(용량 확보)
            sudo docker image prune -f            