name: ReLink Production CI/CD

on:
  push:
    branches: [ "main", "dev" ] # main, dev 브랜치 직접 푸시 및 타 브랜치 PR 머지(Merge) 완료 시 실행
  pull_request: # PR 단계에서 수정한 워크플로우 파일이 즉각 작동하도록 원복 (동일 저장소 내 PR이므로 Secrets 주입 가능)
    branches: [ "main", "dev" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 소스 코드 가져오기

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # 자바 실행 환경 설정

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar # 빌드해서 실행 파일(Jar) 생성

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # 도커 허브 로그인

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/relink-backend:latest # 도커 이미지 만들어서 업로드

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 소스 코드 가져오기

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # 도커 허브 로그인

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/relink-frontend:latest # 프론트엔드 Nginx 도커 이미지 만들어서 업로드

  deploy:
    needs: [build-backend, build-frontend] # 백엔드와 프론트엔드 빌드가 모두 성공해야 배포 시작
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 설정 파일 복사를 위해 Checkout 추가

      - name: Copy config files via SCP
        uses: appleboy/scp-action@master # 최신 도커 컴포즈 & Nginx 설정을 서버로 자동 복사
        with:
          host: ${{ secrets.PROD_VM1_HOST }}
          username: ${{ secrets.PROD_VM1_USER }}
          key: ${{ secrets.PROD_VM1_SSH_KEY }}
          source: "deploy/prod/web/docker-compose-prod-web.yml,deploy/prod/web/nginx-prod.conf"
          target: "~/Searchweb/deploy"
          strip_components: 3

      - name: Deploy to Oracle Cloud VM1
        uses: appleboy/ssh-action@master # 서버에 원격 접속하여 배포 명령 실행
        with:
          host: ${{ secrets.PROD_VM1_HOST }}
          username: ${{ secrets.PROD_VM1_USER }}
          key: ${{ secrets.PROD_VM1_SSH_KEY }}
          script: |
            cd ~/Searchweb/deploy
            # 기존 컨테이너 이름(relink-app, relink-nginx) 충돌 방지를 위해 선삭제 조치
            sudo docker rm -f relink-app relink-nginx || true
            # 서버에서 최신 프론트 및 백엔드 이미지로 교체 및 재시작
            sudo docker compose -f docker-compose-prod-web.yml pull
            sudo docker compose -f docker-compose-prod-web.yml up -d
            # 오래된 이미지 파일 정리(용량 확보)
            sudo docker image prune -f            