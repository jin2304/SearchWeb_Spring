# Prod Postgres settings
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

## Prod App settings
app.oauth2.redirect-uri=${PROD_FRONTEND_URL}/auth/callback
app.cookie.secure=${PROD_COOKIE_SECURE:true}

## Prod OAUTH2
spring.security.oauth2.client.registration.naver.redirect-uri=${PROD_NAVER_OAUTH_REDIRECT_URI}
spring.security.oauth2.client.registration.google.redirect-uri=${PROD_GOOGLE_OAUTH_REDIRECT_URI}
spring.security.oauth2.client.registration.kakao.redirect-uri=${PROD_KAKAO_OAUTH_REDIRECT_URI}

## Proxy settings (Cloudflare/Nginx)
server.forward-headers-strategy=native
