spring.application.name=SearchWeb

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# mybatis settings
mybatis.mapper-locations=classpath:mapper/*.xml
logging.level.org.mybatis=DEBUG

#logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.com.web.SearchWeb=DEBUG
# 콘솔 로그 색상 활성화
spring.output.ansi.enabled=ALWAYS


##### OAuth2 settings #####
#naver settings
#registration
spring.security.oauth2.client.registration.naver.client-name=naver
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email
#provider
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response


#google settings
#registration
spring.security.oauth2.client.registration.google.client-name=google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.scope=profile,email


#kakao settings
#registration
spring.security.oauth2.client.registration.kakao.client-name=kakao
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname, account_email
#provider
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

#spring.config.import=optional:dotenv:.env

##### Spring AI settings #####
# 기본 AI Provider (Qualifier 없이 @Autowired ChatClient 사용할 때만 필요)
spring.ai.provider=groq

# AI 모델 활성화 설정 (true(기본값), false로 설정하면 비활성화)
spring.ai.enabled.openai=false
spring.ai.enabled.gemini=true
spring.ai.enabled.groq=true

# AI 프롬프트 버전 선택 (v1, v2, v3 ... 중 선택)
# - System Prompt: 버전별로 로직/규칙이 다르므로 버전을 유지
# - User Prompt: 제공되는 데이터 포맷은 동일하므로 common 파일을 공유
app.ai.prompt.version=v3
app.ai.prompt.system=classpath:prompts/link-analysis-system-${app.ai.prompt.version}.txt
app.ai.prompt.user=classpath:prompts/link-analysis-user-common.st

# OpenAI setting
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL}
spring.ai.openai.chat.options.temperature=${OPENAI_CHAT_TEMPERATURE}

# Google Gemini settings (Google AI Studio API Key)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL}
spring.ai.google.genai.chat.options.temperature=${GEMINI_CHAT_TEMPERATURE}

# Groq settings
spring.ai.groq.api-key=${GROQ_API_KEY}
spring.ai.groq.chat.options.model=${GROQ_CHAT_MODEL}
spring.ai.groq.chat.options.temperature=${GROQ_CHAT_TEMPERATURE}

##### JWT settings #####
# jwt.secret: JWT 서명에 사용할 비밀 키 (HS256 알고리즘 사용 시 최소 32바이트 이상의 문자열 권장)
jwt.secret=${JWT_SECRET}
# jwt.access-token-expiry: Access Token 만료 시간 (밀리초 단위, 예: 3600000 = 1시간)
jwt.access-token-expiry=${JWT_ACCESS_TOKEN_EXPIRY}
# jwt.refresh-token-expiry: Refresh Token 만료 시간 (밀리초 단위, 예: 604800000 = 7일)
jwt.refresh-token-expiry=${JWT_REFRESH_TOKEN_EXPIRY}
# jwt.refresh-token-path: Refresh Token 쿠키 경로 (보안을 위해 /api/auth로 한정)
jwt.refresh-token-path=/api/auth

